name: Atena cloud health pulse
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Wake and test public services
        shell: bash
        run: |
          set -u
          failures=0
          check() {
            name="$1"; url="$2"
            code=$(curl -L -sS --max-time 90 -o /tmp/response -w '%{http_code}' "$url" || true)
            echo "$name -> HTTP $code"
            if [[ "$code" != 2* && "$code" != 3* ]]; then failures=$((failures+1)); fi
          }
          check "n8n" "https://atena-n8n.onrender.com/healthz"
          check "FreeLLMAPI" "https://freellmapi-atena.onrender.com/api/ping"
          check "Scraper Quantico" "https://scraper-quantico.onrender.com/health"
          check "SnapDeploy" "https://atena-2-nano.containers.snapdeploy.app/"
          if [ "$failures" -ge 4 ]; then echo "Todos os serviços falharam nesta rodada." >&2; exit 1; fi
